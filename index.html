
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love - 女人的美味</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #fff4f6, #fffafa);
    font-family: Arial, "Microsoft YaHei", sans-serif;
    color: #704653;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

/* 标题 */
.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    color: #e66b8b;
    font-size: 32px;
    letter-spacing: 4px;
}

.header p {
    color: #b58b98;
    margin-top: 10px;
    font-size: 14px;
}

/* 花朵装饰 */
.decorations {
    text-align: center;
    font-size: 26px;
    letter-spacing: 10px;
    margin: 15px 0 20px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

.flower {
    display: block;
    width: 100%;
    max-width: 550px;
    max-height: 320px;
    height: auto;
    object-fit: contain;
    margin: 0 auto;
    border: none;
    border-radius: 16px;
    box-shadow: none;
    background: transparent;
}
/* 花朵文字 */
.flower-text {
    text-align: center;
    padding: 20px 10px;
    color: #d77b95;
    font-size: 16px;
    letter-spacing: 2px;
}

/* 视频标题 */
.video-title {
    margin: 8px auto 18px;
    text-align: center;
    color: #d95b79;
    font-size: 23px;
    font-weight: 600;
    letter-spacing: 2px;
    line-height: 1.6;
}

/* 视频 */
.video-box {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(200, 100, 130, .18);
}

video {
    display: block;
    width: 100%;
    height: auto;
}

/* 底部 */
.footer {
    text-align: center;
    padding: 28px 0 15px;
    color: #c58b9b;
    font-size: 14px;
    line-height: 2;
}

/* 手机适配 */
@media(max-width: 600px) {
    .container {
        padding: 20px 14px;
    }

    .header h1 {
        font-size: 27px;
    }

    .decorations {
        font-size: 22px;
        letter-spacing: 7px;
    }

    .flower {
        max-width: 100%;
        max-height: 240px;
    }

    .flower-text {
        font-size: 14px;
    }

    .flower {
        border-radius: 12px;
    }

    .video-box {
        border-radius: 12px;
    }

    .video-title {
        font-size: 19px;
        margin-bottom: 14px;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- 页面标题 -->
    <header class="header">
        <h1>❤ Love ❤</h1>
        <p>花开有香，美味有爱</p>
    </header>

    <!-- 花朵装饰 -->
    <div class="decorations">
        🌸 🌷 🌹 🌺 🌼
    </div>

    <!-- 原来的鲜花图片 -->
    <img
        class="flower"
        src="https://v.deople.ai/flower.JPG"
        alt="Beautiful Flowers"
    >



    <!-- 视频标题 -->
    <div class="video-title">
        美妙绝伦，回味无穷
    </div>

    <!-- 原来的视频播放器：保留原生封面、自动播放和循环 -->
    <div class="video-box">
        <video
            id="loveVideo"
            controls
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >
            <source
                src="https://v.deople.ai/love.MP4"
                type="video/mp4"
            >
            您的浏览器不支持视频播放。
        </video>
    </div>

    <!-- 页面底部 -->
    <footer class="footer">
        🌸 Love & Happiness 🌸<br>
        Made with ❤
    </footer>

</div>

<script>
// 视频自动播放
const video = document.getElementById("loveVideo");

window.addEventListener("load", function() {
    video.play().catch(function() {
        console.log("浏览器限制自动播放，请点击播放按钮");
    });
});

</script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-384RKFQQZQ');
    </script>
</body>
</html>
